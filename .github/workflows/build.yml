name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./gradlew --no-daemon clean build generateModpack
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialog-auth-server-1.3.0-mc1.21.6
          path: build/libs/dialog-auth-1.3.0.jar
          if-no-files-found: error
      - name: Upload companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialog-auth-companion-1.3.0-mc1.21.6
          path: build/libs/dialog-auth-companion-1.3.0.jar
          if-no-files-found: error
