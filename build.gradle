plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}
version = '1.6.0'
group = 'ru.ldpe'
base { archivesName = 'dialog-auth' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}
sourceSets {
    companion {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
    testImplementation sourceSets.companion.output
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
processCompanionResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.register('companionJar', Jar) {
    dependsOn companionClasses
    archiveBaseName = 'dialog-auth-companion'
    archiveClassifier = ''
    from sourceSets.companion.output
    // Shared protocol classes make the companion independent of the server mod.
    from(sourceSets.main.output) {
        include 'ru/ldpe/dialogauth/AuthCrypto*.class'
        include 'ru/ldpe/dialogauth/DialogAuthPayloads*.class'
        include 'ru/ldpe/dialogauth/mixin/ClientConnectionAccessorMixin.class'
    }
}
tasks.register('verifyCompanionStandalone') {
    dependsOn companionJar
    doLast {
        File jarFile = companionJar.archiveFile.get().asFile
        try (java.util.zip.ZipFile zip = new java.util.zip.ZipFile(jarFile)) {
            def metadataEntry = zip.getEntry('fabric.mod.json')
            assert metadataEntry != null: 'Companion has no fabric.mod.json'
            def metadata = new groovy.json.JsonSlurper().parseText(zip.getInputStream(metadataEntry).getText('UTF-8'))
            assert !metadata.depends.containsKey('dialogauth'): 'Companion must not require the server mod'
            [
                    'ru/ldpe/dialogauth/AuthCrypto.class',
                    'ru/ldpe/dialogauth/DialogAuthPayloads.class',
                    'ru/ldpe/dialogauth/mixin/ClientConnectionAccessorMixin.class'
            ].each { path ->
                assert zip.getEntry(path) != null: "Companion is missing shared class ${path}"
            }
            assert zip.getEntry('ru/ldpe/dialogauth/AuthTask.class') == null: 'Server-only AuthTask leaked into companion'
        }
    }
}
tasks.named('build') { dependsOn verifyCompanionStandalone }
test { useJUnitPlatform() }

tasks.register('generateModpack') {
    dependsOn build
    doLast {
        File output = layout.buildDirectory.dir('modpack').get().asFile
        output.mkdirs()
        File modsDirectory = new File(output, 'mods')
        modsDirectory.deleteDir()
        modsDirectory.mkdirs()
        List<Map> mods = []
        [[id: 'dialogauth-companion', file: layout.buildDirectory.file("libs/dialog-auth-companion-${project.version}.jar").get().asFile]].each { entry ->
            File jarFile = entry.file
            File target = new File(output, "mods/${jarFile.name}")
            target.parentFile.mkdirs()
            target.bytes = jarFile.bytes
            mods.add([
                    id: entry.id,
                    version: project.version,
                    file: jarFile.name,
                    url: "mods/${jarFile.name}",
                    sha256: java.security.MessageDigest.getInstance('SHA-256').digest(jarFile.bytes).encodeHex().toString(),
                    size: jarFile.length()
            ])
        }
        File manifest = new File(output, 'manifest.json')
        manifest.text = groovy.json.JsonOutput.toJson([
                formatVersion: 1,
                minecraft: '26.1.2',
                fabricLoader: '0.20.1',
                mods: mods
        ])
    }
}

if (providers.gradleProperty('modpackSigningKey').isPresent()) {
    tasks.register('signModpack', JavaExec) {
        dependsOn generateModpack
        classpath = sourceSets.companion.runtimeClasspath
        mainClass = 'ru.ldpe.dialogauth.client.ModpackSigner'
        args 'sign', providers.gradleProperty('modpackSigningKey').get(),
                layout.buildDirectory.file('modpack/manifest.json').get().asFile.absolutePath,
                layout.buildDirectory.file('modpack/manifest.sig').get().asFile.absolutePath
    }
}
